name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      - name: Leak guard
        run: bash tools/check-clean.sh
      - name: Gate script tests
        run: python3 -m unittest discover -s .claude/scripts/tests -t .claude/scripts/tests
      - name: Codex adapter tests
        run: python3 -m unittest discover -s .codex -p 'test_*.py'
      - name: Codex entrypoints in sync
        run: python3 .codex/sync-workflow.py --check
      - name: ZCode runtime tests
        run: python3 -m unittest discover -s .zcode -p 'test_*.py'
      - name: ZCode runtime in sync
        run: python3 .zcode/adapt-zcode.py --check
      - name: Resource installation tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Install smoke test
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          proj="$(mktemp -d)"; git -C "$proj" init -q
          bash install.sh --target "$proj" --codex --zcode
          test -f "$proj/.claude/scripts/task-accept.py"
          test -f "$proj/.agents/skills/source-command-build/SKILL.md"
          test -f "$proj/.codex/agents/code-reviewer.toml"
          test -f "$proj/.zcode/skills/build-route/SKILL.md"
          test -f "$proj/.zcode/commands/build.md"
          grep -q "model: GLM-5.3" "$proj/.zcode/agents/code-reviewer.md"
          bash install.sh --target "$proj" --codex --zcode | tee second.log
          grep -q "added 0," second.log
