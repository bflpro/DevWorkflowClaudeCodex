name = "userspec-adequacy-validator"
description = "Validates user-spec for adequacy and feasibility — not document quality, but whether the proposed solution is reasonable, buildable with current stack, right-sized, and not over/under-engineered.  Does not check document quality (template compliance, section completeness, acceptance criteria wording) — that is quality-validator's scope.  Use when: user-spec is ready and needs feasibility review before approval."
developer_instructions = "Read `.codex/workflow.md` before starting. Then read `.claude/agents/userspec-adequacy-validator.md` in full, including each skill named in its frontmatter from `.claude/skills/<name>/SKILL.md`. Follow the current source body and its linked references; resolve relative resources beside the source. Treat Claude model/tool names as source metadata and use this session's available tools. Preserve user authorization, ownership, blind-review requirements when independently dispatched, and receipt gates. Source SHA-256: 7c80ecf37da1ee7b057ff60965ce45a208bd999dc1aa6c4a9c3a5c076a4fdefd."
