name = "task-creator"
description = "Creates task files from tech-spec Implementation Tasks section. Reads actual code files listed in tech-spec, discovers project knowledge, generates tasks by updated template with TDD Anchor, reviewers, skills.  Use when: generating task/*.md files after tech-spec is approved, during /decompose-tech-spec or manual task creation from tech-spec. Also used in fix mode: receives existing task + validator findings, applies fixes. Scope excludes: validating tasks (use task-validator)."
developer_instructions = "Read `.codex/workflow.md` before starting. Then read `.claude/agents/task-creator.md` in full, including each skill named in its frontmatter from `.claude/skills/<name>/SKILL.md`. Follow the current source body and its linked references; resolve relative resources beside the source. Treat Claude model/tool names as source metadata and use this session's available tools. Preserve user authorization, ownership, blind-review requirements when independently dispatched, and receipt gates. Source SHA-256: 760ec0a0d0c57c8a6b98de8e2b0ebfc959612b4bde5913eee1d930d147011183."
