name = "completeness-validator"
description = "Bidirectional requirements traceability: user-spec -> tech-spec/tasks and back. Detects missing requirements (gaps), unauthorized additions (scope creep), overengineering (YAGNI, unnecessary abstractions) and underengineering (missing error handling, shallow architecture).  Use when: validating tech-spec completeness, checking task coverage before implementation. Not for: template compliance (tech-spec-validator), code review, individual task quality."
developer_instructions = "Read `.codex/workflow.md` before starting. Then read `.claude/agents/completeness-validator.md` in full, including each skill named in its frontmatter from `.claude/skills/<name>/SKILL.md`. Follow the current source body and its linked references; resolve relative resources beside the source. Treat Claude model/tool names as source metadata and use this session's available tools. Preserve user authorization, ownership, blind-review requirements when independently dispatched, and receipt gates. Source SHA-256: 9fa2aff22e0c5637e4c97f847100b9919d421bb5853080a790b7a8931098fff1."
