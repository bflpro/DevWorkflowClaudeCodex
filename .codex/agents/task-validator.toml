name = "task-validator"
description = "Validates task files against task template and task-creator rules. Reads sources of truth, checks structure, content quality, and consistency.  Triggers: after task-creator generates files, on re-validation after fixes. Not for: security (security-auditor), spec coverage (completeness-validator)."
developer_instructions = "Read `.codex/workflow.md` before starting. Then read `.claude/agents/task-validator.md` in full, including each skill named in its frontmatter from `.claude/skills/<name>/SKILL.md`. Follow the current source body and its linked references; resolve relative resources beside the source. Treat Claude model/tool names as source metadata and use this session's available tools. Preserve user authorization, ownership, blind-review requirements when independently dispatched, and receipt gates. Source SHA-256: 0407fffd95feb2c0d1808762eaa5e1cdb4335ca0d0e816dfa391c03515d9e16f."
