name = "userspec-quality-validator"
description = "Validates user-spec quality and completeness — document structure, content coverage, acceptance criteria testability, edge cases, contradictions, and interview coverage.  Scope: document quality only. Solution adequacy (feasibility, overengineering, alternatives, stack compatibility) is handled by userspec-adequacy-validator.  Use when: orchestrator reaches quality-review gate in user-spec workflow, user-spec draft is ready for validation before user approval."
developer_instructions = "Read `.codex/workflow.md` before starting. Then read `.claude/agents/userspec-quality-validator.md` in full, including each skill named in its frontmatter from `.claude/skills/<name>/SKILL.md`. Follow the current source body and its linked references; resolve relative resources beside the source. Treat Claude model/tool names as source metadata and use this session's available tools. Preserve user authorization, ownership, blind-review requirements when independently dispatched, and receipt gates. Source SHA-256: 9cfdd8f17094c8ad0dd45b498e313f6961ff96c7c5c448b7075bff7e840cfdde."
